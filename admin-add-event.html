<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Event — BookEase Admin</title>
    <link rel="stylesheet" href="booking/css/themes.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo"><h2>BookEase Admin</h2></div>
        <ul class="nav-links">
            <li><a href="admin-dashboard.html">Dashboard</a></li>
            <li><a href="admin-add-event.html">Add Event</a></li>
            <li><a href="admin-manage-events.html">Manage Events</a></li>
        </ul>
        <button id="adminLogoutBtn" class="logout-btn">Logout</button>
    </nav>

    <div class="admin-page">
        <h1>Add New Event</h1>

        <form id="addEventForm" class="event-form">
            <label for="eventTitle">Event Title</label>
            <input type="text" id="eventTitle" placeholder="e.g. Coldplay: Music Of The Spheres">

            <label for="eventCategory">Category</label>
            <input type="text" id="eventCategory" placeholder="e.g. Music Concert, Movie, Sports">

            <label for="eventVenue">Venue</label>
            <input type="text" id="eventVenue" placeholder="e.g. DY Patil Stadium, Mumbai">

            <label for="eventDate">Date</label>
            <input type="date" id="eventDate">

            <label for="eventTime">Time</label>
            <input type="time" id="eventTime">

            <label for="eventRegularPrice">Regular Seat Price (₹)</label>
            <input type="number" id="eventRegularPrice" min="1" placeholder="400">

            <label for="eventVipPrice">VIP Seat Price (₹)</label>
            <input type="number" id="eventVipPrice" min="1" placeholder="600">

            <label for="eventPoster">Poster Image URL (optional)</label>
            <input type="text" id="eventPoster" placeholder="/assets/images.jpg">

            <p id="addEventError" class="error-msg"></p>

            <button type="submit">Add Event</button>
        </form>
    </div>

    <script src="js/common.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>

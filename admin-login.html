<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login — BookEase</title>
    <link rel="stylesheet" href="booking/css/themes.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <div class="login-wrapper">
        <div class="login-box">
            <h2>Admin Login</h2>
            <form id="adminLoginForm">
                <input type="text" id="adminUsername" placeholder="Username" autocomplete="username">
                <input type="password" id="adminPassword" placeholder="Password" autocomplete="current-password">
                <p id="loginError" class="error-msg"></p>
                <button type="submit">Log In</button>
            </form>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>

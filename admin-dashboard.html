<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard — BookEase</title>
    <link rel="stylesheet" href="booking/css/themes.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo"><h2>BookEase Admin</h2></div>
        <ul class="nav-links">
            <li><a href="admin-dashboard.html">Dashboard</a></li>
            <li><a href="admin-add-event.html">Add Event</a></li>
            <li><a href="admin-manage-events.html">Manage Events</a></li>
        </ul>
        <button id="adminLogoutBtn" class="logout-btn">Logout</button>
    </nav>

    <div class="admin-page">
        <h1>Admin Dashboard</h1>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Events</h3>
                <p id="totalEvents">0</p>
            </div>
            <div class="stat-card">
                <h3>Total Bookings</h3>
                <p id="totalBookings">0</p>
            </div>
            <div class="stat-card">
                <h3>Total Users</h3>
                <p id="totalUsers">0</p>
            </div>
            <div class="stat-card">
                <h3>Total Revenue</h3>
                <p id="totalRevenue">₹0</p>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
